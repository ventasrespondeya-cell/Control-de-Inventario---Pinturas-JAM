<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5" style="max-width: 600px;">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white p-3 text-center">
                <h3 class="mb-0 fw-bold">➕ Agregar Nuevo Producto</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/agregar">
                    
                    <!-- MENÚ DESPLEGABLE DE CATEGORÍAS AUTOMÁTICO -->
                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Categoría:</label>
                        <select name="categoria" class="form-select form-select-lg border-primary fw-bold" required autofocus>
                            <option value="" disabled selected>-- Selecciona una categoría --</option>
                            {% for cat in categorias %}
                                <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Nombre del Producto:</label>
                        <input type="text" name="nombre" class="form-control form-control-lg" placeholder="Ej. Flexipack Tipo A, Brocha..." required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Color o Variedad:</label>
                        <input type="text" name="color" class="form-control form-control-lg" placeholder="Ej. Blanco, Azul, N/A..." required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Precio de Venta ($):</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-success text-white fw-bold">$</span>
                            <input type="number" step="0.01" name="precio" class="form-control text-success fw-bold" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold fs-5">Stock Inicial:</label>
                            <input type="number" name="stock_actual" class="form-control form-control-lg" placeholder="Cant. actual" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold fs-5">Alerta Stock Mínimo:</label>
                            <input type="number" name="stock_minimo" class="form-control form-control-lg text-danger fw-bold" placeholder="Mínimo ideal" required>
                        </div>
                    </div>

                    <div class="d-grid gap-3 mt-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold py-3 fs-4 shadow">💾 Guardar Producto</button>
                        <a href="/" class="btn btn-outline-secondary btn-lg fw-bold py-2">Cancelar y Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
