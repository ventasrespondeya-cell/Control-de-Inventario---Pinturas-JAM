<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5" style="max-width: 600px;">
        <div class="card shadow border-0">
            <div class="card-header bg-warning text-dark p-3 text-center">
                <h3 class="mb-0 fw-bold">✏️ Editar Producto</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/editar/{{ producto.id }}">
                    
                    <!-- MENÚ DESPLEGABLE CON LA CATEGORÍA PRE-SELECCIONADA -->
                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Categoría:</label>
                        <select name="categoria" class="form-select form-select-lg border-warning fw-bold" required>
                            {% for cat in categorias %}
                                <option value="{{ cat }}" {% if cat == producto.categoria %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Nombre del Producto:</label>
                        <input type="text" name="nombre" class="form-control form-control-lg" value="{{ producto.nombre }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Color o Variedad:</label>
                        <input type="text" name="color" class="form-control form-control-lg" value="{{ producto.color }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Precio de Venta ($):</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-success text-white fw-bold">$</span>
                            <input type="number" step="0.01" name="precio" class="form-control text-success fw-bold" value="{{ producto.precio }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold fs-5">Stock Actual:</label>
                            <input type="number" name="stock_actual" class="form-control form-control-lg" value="{{ producto.stock_actual }}" required>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold fs-5">Alerta Stock Mínimo:</label>
                            <input type="number" name="stock_minimo" class="form-control form-control-lg text-danger fw-bold" value="{{ producto.stock_minimo }}" required>
                        </div>
                    </div>

                    <div class="d-grid gap-3 mt-2">
                        <button type="submit" class="btn btn-warning btn-lg fw-bold py-3 fs-4 shadow">💾 Guardar Cambios</button>
                        <a href="/" class="btn btn-outline-secondary btn-lg fw-bold py-2">Cancelar y Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
