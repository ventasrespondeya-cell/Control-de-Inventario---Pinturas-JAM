<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Producto - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h3 class="mb-0">Editar Producto</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Categoría:</label>
                        <select name="categoria" class="form-select" required>
                            <option value="Pinturas y Acabados" {% if producto.categoria == 'Pinturas y Acabados' %}selected{% endif %}>Pinturas y Acabados</option>
                            <option value="Herramientas y Accesorios" {% if producto.categoria == 'Herramientas y Accesorios' %}selected{% endif %}>Herramientas y Accesorios</option>
                            <option value="Otros" {% if producto.categoria == 'Otros' %}selected{% endif %}>Otros</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del producto:</label>
                        <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                    </div>
                    
                    <!-- Campo de Color con Autocompletado -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Color:</label>
                        <input list="paleta-colores" name="color" class="form-control" value="{{ producto.color }}" required>
                        <datalist id="paleta-colores">
                            <option value="N/A (Herramientas / Accesorios)">
                            <option value="Marfil">
                            <option value="Mantecado">
                            <option value="Marrón">
                            <option value="Marrón Claro">
                            <option value="Gris Oscuro">
                            <option value="Gris Claro">
                            <option value="Gris Azulado">
                            <option value="Blanco">
                            <option value="Negro">
                            <option value="Amarillo Caterpillar">
                            <option value="Amarillo Pollito">
                            <option value="Mostaza">
                            <option value="Amarillo Girasol">
                            <option value="Naranja">
                            <option value="Rojo">
                            <option value="Vinotinto">
                            <option value="Rosado">
                            <option value="Salmón">
                            <option value="Fucsia">
                            <option value="Magenta">
                            <option value="Morado">
                            <option value="Lila">
                            <option value="Azul Turquesa">
                            <option value="Azul (Claro/Pacífico)">
                            <option value="Azul (Oscuro/Majestuoso)">
                            <option value="Verde Pino">
                            <option value="Verde Oliva">
                            <option value="Verde Navidad">
                            <option value="Verde Turquesa">
                            <option value="Aguamarina">
                            <option value="Verde Manzana / Happy">
                        </datalist>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Precio ($):</label>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Stock Actual (Cantidad):</label>
                        <input type="number" name="stock_actual" class="form-control" value="{{ producto.stock_actual }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Stock Mínimo (Alerta):</label>
                        <input type="number" name="stock_minimo" class="form-control" value="{{ producto.stock_minimo }}" required>
                    </div>
                    <button type="submit" class="btn btn-warning fw-bold w-100 mb-2">Actualizar Producto</button>
                    <a href="/" class="btn btn-secondary w-100">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
