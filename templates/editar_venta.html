<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Venta - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h3 class="mb-0">?? Editar Registro de Venta</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Comprador:</label>
                        <input type="text" name="comprador" class="form-control" value="{{ venta.comprador }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Método de Pago:</label>
                        <select name="metodo_pago" class="form-select" required>
                            <option value="Efectivo" {% if venta.metodo_pago == 'Efectivo' %}selected{% endif %}>Efectivo</option>
                            <option value="Transferencia" {% if venta.metodo_pago == 'Transferencia' %}selected{% endif %}>Transferencia</option>
                            <option value="Pago Móvil" {% if venta.metodo_pago == 'Pago Móvil' %}selected{% endif %}>Pago Móvil</option>
                            <option value="Punto de Venta" {% if venta.metodo_pago == 'Punto de Venta' %}selected{% endif %}>Punto de Venta</option>
                            <option value="Divisas" {% if venta.metodo_pago == 'Divisas' %}selected{% endif %}>Divisas</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cantidad Vendida:</label>
                        <input type="number" name="cantidad" class="form-control" value="{{ venta.cantidad }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Total Cobrado ($):</label>
                        <input type="number" step="0.01" name="total" class="form-control" value="{{ venta.total }}" required>
                    </div>
                    
                    <div class="alert alert-info py-2" style="font-size: 0.9em;">
                        <strong>Nota:</strong> Modificar la cantidad aquí solo corrige el registro financiero. No devolverá pintura al inventario automáticamente.
                    </div>

                    <button type="submit" class="btn btn-warning fw-bold w-100 mb-2">Guardar Cambios</button>
                    <a href="/historial" class="btn btn-secondary w-100">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
