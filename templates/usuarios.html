<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>?? Gestión de Usuarios</h2>
            <a href="/" class="btn btn-dark btn-sm fw-bold">Volver al Inventario</a>
        </div>

        <div class="card shadow-sm mb-4 border-primary">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">? Crear o Actualizar Contraseña de Usuario</h5>
            </div>
            <div class="card-body">
                <form action="/usuarios" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre de Usuario:</label>
                        <input type="text" name="username" class="form-control" placeholder="Ej: suegra, vendedor1, gerente" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nueva Contraseña:</label>
                        <input type="text" name="password" class="form-control" placeholder="Escribe la contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">?? Guardar / Actualizar Usuario</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">?? Usuarios Registrados</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0 text-center align-middle">
                    <thead class="table-light">
                        <tr>
                            <th># ID</th>
                            <th>Usuario</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in lista_usuarios %}
                        <tr>
                            <td>{{ u.id }}</td>
                            <td class="fw-bold">{{ u.username }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
