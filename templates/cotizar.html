<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generar Cotización - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5" style="max-width: 800px;">
        <div class="card shadow">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">?? Generar Cotización / Presupuesto</h4>
                <a href="/" class="btn btn-outline-light btn-sm fw-bold">Volver</a>
            </div>
            <div class="card-body">
                <form action="/cotizar" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Cliente / Empresa:</label>
                        <input type="text" name="cliente" class="form-control" placeholder="Ej: Constructora XYZ / Juan Pérez" required>
                    </div>

                    <h5 class="mt-4 mb-3 border-bottom pb-2">Seleccionar Productos</h5>
                    
                    <div id="productosContainer">
                        <div class="row g-2 mb-2 producto-fila">
                            <div class="col-md-7">
                                <select name="producto_id[]" class="form-select" required>
                                    <option value="">-- Seleccionar Producto --</option>
                                    {% for p in productos %}
                                    <option value="{{ p.id }}">{{ p.nombre }} ({{ p.color }}) - ${{ "%.2f"|format(p.precio) }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="number" name="cantidad[]" class="form-control" placeholder="Cantidad" min="1" value="1" required>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-danger w-100" onclick="eliminarFila(this)">?</button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-outline-primary btn-sm mb-4 fw-bold" onclick="agregarFila()">? Añadir otro producto</button>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success fw-bold btn-lg">?? Generar Presupuesto Imprimible / PDF</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function agregarFila() {
            const container = document.getElementById('productosContainer');
            const primeraFila = container.querySelector('.producto-fila');
            const nuevaFila = primeraFila.cloneNode(true);
            nuevaFila.querySelector('select').value = '';
            nuevaFila.querySelector('input').value = '1';
            container.appendChild(nuevaFila);
        }

        function eliminarFila(btn) {
            const filas = document.querySelectorAll('.producto-fila');
            if (filas.length > 1) {
                btn.closest('.producto-fila').remove();
            }
        }
    </script>
</body>
</html>
