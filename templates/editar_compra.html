<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Compra - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-dark text-white p-4">
                <h3 class="mb-0 fw-bold"><i class="fas fa-edit me-2"></i> Editar Registro de Compra #{{ compra.id }}</h3>
            </div>
            <div class="card-body p-4 bg-white">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Producto</label>
                        <input type="text" class="form-control" value="{{ compra.producto_nombre }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Proveedor</label>
                        <input type="text" name="proveedor" class="form-control" value="{{ compra.proveedor }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Costo Unitario ($)</label>
                        <input type="number" step="0.01" name="costo_unitario" class="form-control" value="{{ compra.costo_unitario }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cantidad</label>
                        <input type="number" name="cantidad" class="form-control" value="{{ compra.cantidad }}" required>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="/historial_compras" class="btn btn-secondary btn-lg fw-bold px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-lg fw-bold px-4">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
