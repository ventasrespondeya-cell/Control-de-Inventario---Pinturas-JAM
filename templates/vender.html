<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Procesar Venta - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow border-success">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Procesar Venta</h3>
            </div>
            <div class="card-body">
                <h5 class="text-secondary">Producto: {{ producto.nombre }} ({{ producto.color }})</h5>
                <p><strong>Precio unitario:</strong> ${{ producto.precio }} | <strong>Stock disponible:</strong> {{ producto.stock_actual }}</p>
                <hr>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Comprador:</label>
                        <input type="text" name="comprador" class="form-control" placeholder="Ej: Juan Perez" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Método de Pago:</label>
                        <select name="metodo_pago" class="form-select" required>
                            <option value="Efectivo ($)">Efectivo ($)</option>
                            <option value="Efectivo (Bs)">Efectivo (Bs)</option>
                            <option value="Pago Movil / Transferencia">Pago Móvil / Transferencia</option>
                            <option value="Zelle / Divisas Digitales">Zelle / Divisas Digitales</option>
                            <option value="Punto de Venta">Punto de Venta</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cantidad a vender:</label>
                        <input type="number" name="cantidad" class="form-control" value="1" min="1" max="{{ producto.stock_actual }}" required>
                    </div>
                    <button type="submit" class="btn btn-success fw-bold w-100 mb-2">Confirmar Venta y Cobrar</button>
                    <a href="/" class="btn btn-secondary w-100">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
