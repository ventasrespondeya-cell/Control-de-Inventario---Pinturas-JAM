<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5" style="max-width: 600px;">
        <div class="card shadow border-0">
            <div class="card-header bg-success text-white p-3 text-center">
                <h3 class="mb-0 fw-bold">🛒 Registrar Venta Rápida</h3>
            </div>
            <div class="card-body p-4">
                
                <div class="alert alert-info text-center mb-4">
                    <h4 class="text-primary fw-bold mb-1">{{ producto.nombre }}</h4>
                    <span class="badge bg-secondary fs-6">{{ producto.color }}</span>
                    <h5 class="mt-2 fw-bold text-success">Precio: ${{ "%.2f"|format(producto.precio) }}</h5>
                </div>

                <form method="POST" action="/vender/{{ producto.id }}">
                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Cantidad a Vender:</label>
                        <input type="number" name="cantidad" min="1" max="{{ producto.stock_actual }}" class="form-control form-control-lg fw-bold text-center text-primary" value="1" required autofocus>
                        <small class="text-danger fw-bold">Stock disponible: {{ producto.stock_actual }} unidades</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5">Nombre del Comprador:</label>
                        <input type="text" name="comprador" class="form-control form-control-lg" value="Consumidor Final" required>
                    </div>

                    <!-- NUEVOS MÉTODOS DE PAGO INCLUYENDO BINANCE -->
                    <div class="mb-5">
                        <label class="form-label fw-bold fs-5">Método de Pago:</label>
                        <select name="metodo_pago" class="form-select form-select-lg border-success fw-bold" required>
                            <option value="Efectivo (Bs)">💵 Efectivo (Bolívares)</option>
                            <option value="Divisas (USD/EUR)">💵 Divisas (Efectivo USD/EUR)</option>
                            <option value="Punto de Venta">💳 Punto de Venta</option>
                            <option value="Pago Movil">📱 Pago Móvil</option>
                            <option value="Transferencia">🏦 Transferencia Bancaria</option>
                            <option value="Binance">🟡 Binance (USDT)</option>
                        </select>
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-success btn-lg fw-bold py-3 fs-4 shadow">💳 Confirmar y Cobrar</button>
                        <a href="/" class="btn btn-outline-secondary btn-lg fw-bold py-2">Cancelar y Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
