<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entrada de Mercancía - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5" style="max-width: 950px;">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white p-4 d-flex justify-content-between align-items-center">
                <h2 class="mb-0 fw-bold"><i class="fas fa-truck-loading me-2"></i> Recepción de Mercancía</h2>
                <a href="/" class="btn btn-outline-light fw-bold fs-5">Volver al Inicio</a>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="/comprar" id="form-compra">
                    
                    <!-- Datos del Proveedor -->
                    <div class="mb-5 bg-light p-4 rounded border shadow-sm">
                        <h4 class="fw-bold mb-3 text-primary"><i class="fas fa-building me-2"></i> Datos de la Factura / Compra</h4>
                        <div class="row">
                            <div class="col-md-12">
                                <label class="form-label fw-bold fs-5">Nombre del Proveedor:</label>
                                <input type="text" name="proveedor" class="form-control form-control-lg border-primary" placeholder="Ej. Pinturas Montana C.A..." required autofocus>
                            </div>
                        </div>
                    </div>

                    <!-- Lista de Productos Recibidos -->
                    <h4 class="fw-bold mb-3 text-primary"><i class="fas fa-boxes me-2"></i> Productos a Ingresar al Inventario</h4>
                    <div class="table-responsive mb-3 shadow-sm">
                        <table class="table table-bordered align-middle bg-white" id="tabla-productos">
                            <thead class="table-primary fs-5">
                                <tr>
                                    <th style="width: 45%;">🔍 Buscar Producto</th>
                                    <th style="width: 20%;" class="text-center">Costo Unit. ($)</th>
                                    <th style="width: 15%;" class="text-center">Cantidad</th>
                                    <th style="width: 15%;" class="text-center">Subtotal</th>
                                    <th style="width: 5%;"></th>
                                </tr>
                            </thead>
                            <tbody id="lista-items">
                                <tr class="item-fila">
                                    <td>
                                        <input type="text" class="form-control form-control-lg input-busqueda-prod fw-bold" placeholder="🔍 Buscar producto..." autocomplete="off" required>
                                        <input type="hidden" name="producto_id[]" class="input-id-prod" required>
                                    </td>
                                    <td>
                                        <input type="number" name="costo_unitario[]" class="form-control form-control-lg input-costo fw-bold text-center" min="0.01" step="0.01" value="0.00" required oninput="calcularTotal()">
                                    </td>
                                    <td>
                                        <input type="number" name="cantidad[]" class="form-control form-control-lg input-cantidad fw-bold text-center text-primary" min="1" value="1" required oninput="calcularTotal()">
                                    </td>
                                    <td class="text-center fs-5 fw-bold text-danger subtotal-fila">$0.00</td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-danger btn-lg shadow-sm" onclick="eliminarFila(this)" title="Quitar"><i class="fas fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-5 gap-3">
                        <button type="button" class="btn btn-outline-primary btn-lg fw-bold shadow-sm" onclick="agregarFila()">
                            <i class="fas fa-plus-circle me-1"></i> Añadir otra línea
                        </button>
                        
                        <div class="text-end bg-primary text-white p-3 rounded shadow-lg border border-light">
                            <span class="fs-5 text-light">Total Inversión de Factura:</span><br>
                            <span class="fs-1 fw-bold" id="total-compra">$0.00</span>
                        </div>
                    </div>

                    <!-- Botón de Acción -->
                    <button type="submit" class="btn btn-success btn-lg fw-bold py-3 fs-4 shadow w-100">
                        <i class="fas fa-save me-2"></i> REGISTRAR ENTRADA Y SUMAR AL INVENTARIO
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Catálogo para el buscador con datos inyectados por Flask
        const catalogoProductos = [
            {% for p in productos %}
            { id: "{{ p.id }}", texto: "{{ p.nombre }} - {{ p.color }} [{{ p.categoria }}]" },
            {% endfor %}
        ];

        document.addEventListener("DOMContentLoaded", function() {
            configurarFila(document.querySelector('.item-fila'));
        });

        function configurarFila(fila) {
            let inputBusqueda = fila.querySelector('.input-busqueda-prod');
            let inputId = fila.querySelector('.input-id-prod');
            
            // Generar ID único para el datalist para que no choque con otras filas
            let listId = 'datalist_' + Math.random().toString(36).substr(2, 9);
            inputBusqueda.setAttribute('list', listId);
            
            let datalist = document.createElement('datalist');
            datalist.id = listId;
            
            catalogoProductos.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.texto;
                opt.setAttribute('data-id', p.id);
                datalist.appendChild(opt);
            });
            
            fila.appendChild(datalist);

            // Al seleccionar una opción, guardar su ID real
            inputBusqueda.addEventListener('input', function(e) {
                let val = e.target.value;
                inputId.value = '';
                let opciones = datalist.options;
                for(let i=0; i<opciones.length; i++) {
                    if(opciones[i].value === val) {
                        inputId.value = opciones[i].getAttribute('data-id');
                        break;
                    }
                }
            });
        }

        function calcularTotal() {
            let filas = document.querySelectorAll('.item-fila');
            let totalSuma = 0;

            filas.forEach(fila => {
                let costo = parseFloat(fila.querySelector('.input-costo').value) || 0;
                let cantidad = parseInt(fila.querySelector('.input-cantidad').value) || 0;
                
                let subtotal = costo * cantidad;
                fila.querySelector('.subtotal-fila').innerText = '$' + subtotal.toFixed(2);
                totalSuma += subtotal;
            });

            document.getElementById('total-compra').innerText = '$' + totalSuma.toFixed(2);
        }

        function agregarFila() {
            let tbody = document.getElementById('lista-items');
            let filas = tbody.getElementsByClassName('item-fila');
            let nuevaFila = filas[0].cloneNode(true);
            
            // Limpiar valores de la fila clonada
            nuevaFila.querySelector('.input-busqueda-prod').value = '';
            nuevaFila.querySelector('.input-id-prod').value = '';
            nuevaFila.querySelector('.input-costo').value = '0.00';
            nuevaFila.querySelector('.input-cantidad').value = 1;
            nuevaFila.querySelector('.subtotal-fila').innerText = '$0.00';
            
            // Quitar el datalist viejo
            let viejoDatalist = nuevaFila.querySelector('datalist');
            if(viejoDatalist) viejoDatalist.remove();

            tbody.appendChild(nuevaFila);
            configurarFila(nuevaFila); // Configurar de nuevo para que tenga su propio datalist
            calcularTotal();
        }

        function eliminarFila(btn) {
            let tbody = document.getElementById('lista-items');
            let filas = tbody.getElementsByClassName('item-fila');
            
            if (filas.length > 1) {
                btn.closest('tr').remove();
                calcularTotal();
            } else {
                alert("Debe haber al menos un producto en la lista.");
            }
        }
    </script>
</body>
</html>
