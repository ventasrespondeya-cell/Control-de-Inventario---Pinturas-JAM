<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entrada de Mercancía - Pinturas JAM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">?? Registrar Entrada de Mercancía</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Seleccionar Producto:</label>
                        <select name="producto_id" class="form-select" required>
                            <option value="">-- Elige un producto --</option>
                            {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.nombre }} ({{ p.color }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Proveedor / Distribuidor:</label>
                        <input type="text" name="proveedor" class="form-control" placeholder="Ej: Corimon, Montana, Dist. Central" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Costo Unitario de Compra ($):</label>
                        <input type="number" step="0.01" name="costo_unitario" class="form-control" placeholder="Costo por unidad" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Cantidad de Unidades Recibidas:</label>
                        <input type="number" name="cantidad" min="1" class="form-control" placeholder="Ej: 10" required>
                    </div>
                    <button type="submit" class="btn btn-primary fw-bold w-100 mb-2">? Registrar Compra y Sumar Stock</button>
                    <a href="/" class="btn btn-secondary w-100">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
